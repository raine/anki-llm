[package]
name = "anki-llm"
version = "2.0.18"
edition = "2024"
authors = ["Raine Virta"]
description = "A command-line interface for bulk-processing Anki flashcards with LLMs"
readme = "README.md"
license = "MIT"
repository = "https://github.com/raine/anki-llm"
homepage = "https://github.com/raine/anki-llm"
keywords = ["anki", "llm", "flashcards", "cli", "openai"]
categories = ["command-line-utilities"]
include = ["src/**/*", "tests/**/*", "README.md", "LICENSE", "CHANGELOG.md", "ANKI_CONNECT.md"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "env"] }
indicatif = "0.18"
inquire = "0.9"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
csv = "1.3"

# HTTP
ureq = { version = "3", features = ["json", "rustls"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Data structures
indexmap = { version = "2", features = ["serde"] }
regex = "1"

# Files
tempfile = "3"
home = "0.5"

# Clipboard
arboard = "3"

# Markdown / HTML
pulldown-cmark = "0.13"
ammonia = "4"

# JSON repair
# Note: the similarly named `json-repair` crate is not usable on stable Rust —
# its transitive dep `named-item` requires a nightly-only feature.
jsonrepair = "0.1"

# TTS audio hashing and media upload
sha2 = "0.11"
base64 = "0.22"
http = "1"

# Terminal UI
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"
tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
rand = "0.10.1"
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std", "tls12"] }

[features]
integration = []

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serial_test = "3.4.0"
